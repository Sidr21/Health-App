[project]
name = "health-backend"
version = "0.1.0"
description = "Ingestion, storage and analytics engine for the COROS + Apple Health app"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "fitdecode",
    "httpx",
    "mcp>=1.2",
    "numpy",
    "pandas",
    "pydantic-settings",
    "python-dateutil",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "typer",
    "uvicorn[standard]",
]

[project.scripts]
health = "health.cli:app"

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["health"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults is the framework idiom

[tool.pytest.ini_options]
testpaths = ["tests"]

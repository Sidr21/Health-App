# Fly.io deploy for the backend: one always-on machine + a 1 GB volume for SQLite, raw files
# and the COROS token. Steps in docs/SETUP.md §3. Run `fly deploy` from this directory.
app = "health-sidr21"            # must be unique on Fly: change it if `fly launch` says taken
primary_region = "ewr"           # New Jersey, closest to New York

[build]
  dockerfile = "Dockerfile"

[env]
  HEALTH_DATA_DIR = "/data"
  HEALTH_DATABASE_URL = "sqlite:////data/health.db"
  HEALTH_TIMEZONE = "America/New_York"
  HEALTH_SYNC_INTERVAL_MIN = "15"
  HEALTH_DOCS = "false"
  HEALTH_PUBLIC = "true"           # refuse to start without a strong HEALTH_API_TOKEN
  # HEALTH_API_TOKEN and HEALTH_COROS_TOKEN_JSON are secrets: `fly secrets set ...`

[[mounts]]
  source = "health_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # the sync scheduler lives in this process, so the machine must never sleep
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
